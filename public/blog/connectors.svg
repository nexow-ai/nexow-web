<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nexow connector network illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#10c5a3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#10c5a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2adfba"/>
      <stop offset="1" stop-color="#8189fc"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#2adfba"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#e8ecf5">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="185" height="44" rx="22" fill="#10c5a3" fill-opacity="0.12" stroke="#10c5a3" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#5cf0d0">#connectors</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="600" cy="320" rx="260" ry="220" fill="#10c5a3" fill-opacity="0.06" filter="url(#soft)"/>
    <line x1="600" y1="320" x2="600.0" y2="147.8" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="2" />
    <line x1="600" y1="320" x2="781.9" y2="233.9" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <line x1="600" y1="320" x2="781.9" y2="406.1" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="2" />
    <line x1="600" y1="320" x2="600.0" y2="492.2" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <line x1="600" y1="320" x2="418.1" y2="406.1" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="2" />
    <line x1="600" y1="320" x2="418.1" y2="233.9" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <rect x="560" y="117.80000000000001" width="80" height="60" rx="16" fill="#10c5a3" fill-opacity="0.18" stroke="#2adfba" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="741.8653347947321" y="203.9" width="80" height="60" rx="16" fill="#6366f1" fill-opacity="0.1" stroke="#8189fc" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="741.8653347947321" y="376.09999999999997" width="80" height="60" rx="16" fill="#6366f1" fill-opacity="0.1" stroke="#8189fc" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="560" y="462.2" width="80" height="60" rx="16" fill="#10c5a3" fill-opacity="0.18" stroke="#2adfba" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="378.1346652052679" y="376.1" width="80" height="60" rx="16" fill="#6366f1" fill-opacity="0.1" stroke="#8189fc" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="378.1346652052679" y="203.89999999999998" width="80" height="60" rx="16" fill="#6366f1" fill-opacity="0.1" stroke="#8189fc" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="624.0" cy="131.8" r="4" fill="#5cf0d0"/>
    <circle cx="805.9" cy="217.9" r="4" fill="#8189fc"/>
    <circle cx="805.9" cy="390.1" r="4" fill="#8189fc"/>
    <circle cx="624.0" cy="476.2" r="4" fill="#5cf0d0"/>
    <circle cx="442.1" cy="390.1" r="4" fill="#8189fc"/>
    <circle cx="442.1" cy="217.9" r="4" fill="#8189fc"/>
    <rect x="522" y="268" width="156" height="104" rx="22" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
    <rect x="522" y="268" width="156" height="104" rx="22" fill="#10c5a3" fill-opacity="0.12"/>
    <path d="M570 320 l20 20 l40 -44" fill="none" stroke="#5cf0d0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
