<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A keyed connection feeding one cached read-only endpoint that three readers share, illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="112" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#feeds</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="600" cy="350" rx="440" ry="230" fill="#f59e0b" fill-opacity="0.05" filter="url(#soft)"/>

    <!-- the author's keyed connection: a key inside a sealed vault -->
    <g>
      <rect x="118" y="272" width="176" height="164" rx="26" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <rect x="118" y="272" width="176" height="164" rx="26" fill="#f59e0b" fill-opacity="0.11"/>
      <circle cx="188" cy="341" r="21" fill="none" stroke="#fde68a" stroke-width="5"/>
      <path d="M203 353 l38 38 l-16 16 l-11 -11 l-9 9 l-11 -11 l9 -9 z" fill="#fde68a"/>
      <text x="146" y="415" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="18" fill="#fde68a">your key</text>
    </g>

    <!-- one bounded refresh: the only arrow that touches the venue -->
    <path d="M300 354 H406" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M394 344 l14 10 l-14 10" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="304" y="330" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="17" fill="#fde68a">1 refresh / ttl</text>

    <!-- the cached, read-only endpoint -->
    <g>
      <rect x="412" y="236" width="366" height="236" rx="28" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <rect x="412" y="236" width="366" height="236" rx="28" fill="#f59e0b" fill-opacity="0.07"/>
      <g>
        <rect x="444" y="270" width="78" height="34" rx="17" fill="#fbbf24"/>
        <text x="462" y="293" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="17" font-weight="700" fill="#08090d">GET</text>
      </g>
      <rect x="536" y="270" width="210" height="34" rx="17" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>
      <text x="554" y="293" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="16" fill="#fde68a">/you/api/w/…</text>

      <!-- the cached copy everyone shares -->
      <g>
        <ellipse cx="595" cy="356" rx="96" ry="22" fill="none" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="3"/>
        <path d="M499 356 v46 a96 22 0 0 0 192 0 v-46" fill="none" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="3"/>
        <ellipse cx="595" cy="356" rx="60" ry="13" fill="#f59e0b" fill-opacity="0.22"/>
      </g>
      <text x="512" y="452" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="17" fill="#fde68a">one cached copy</text>
    </g>

    <!-- three readers, none of them holding a key -->
    <path d="M784 300 H872" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
    <path d="M784 354 H872" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
    <path d="M784 408 H872" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
    <g>
      <rect x="878" y="266" width="204" height="68" rx="20" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>
      <polyline points="906,314 936,292 960,304 1000,282 1052,296" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="878" y="320" width="204" height="68" rx="20" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.32" stroke-width="2"/>
      <polyline points="906,368 946,352 982,362 1016,338 1052,350" fill="none" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="878" y="374" width="204" height="68" rx="20" fill="#f59e0b" fill-opacity="0.06" stroke="#8a7b57" stroke-opacity="0.5" stroke-width="2"/>
      <polyline points="906,422 942,410 976,418 1014,396 1052,406" fill="none" stroke="#8a7b57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="884" y="474" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="17" fill="#8a7b57">no connection needed</text>
  </g>
</svg>
