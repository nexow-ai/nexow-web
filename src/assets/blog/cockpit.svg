<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clean canvas with a dock folding into a puck and a tip toast illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="112" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#design</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="600" cy="330" rx="320" ry="220" fill="#f59e0b" fill-opacity="0.06" filter="url(#soft)"/>

    <!-- tidy auto-laid-out canvas: clean mosaic of widgets -->
    <g>
      <rect x="330" y="170" width="250" height="150" rx="16" fill="#f59e0b" fill-opacity="0.07" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="2.5"/>
      <polyline points="356,290 406,246 456,266 552,204" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="600" y="170" width="250" height="150" rx="16" fill="#f59e0b" fill-opacity="0.07" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="2.5"/>
      <rect x="626" y="196" width="120" height="10" rx="5" fill="#fde68a" fill-opacity="0.6"/>
      <rect x="626" y="222" width="180" height="10" rx="5" fill="#fde68a" fill-opacity="0.4"/>
      <rect x="626" y="248" width="150" height="10" rx="5" fill="#fde68a" fill-opacity="0.4"/>
      <rect x="330" y="340" width="520" height="130" rx="16" fill="#f59e0b" fill-opacity="0.05" stroke="#8a7b57" stroke-opacity="0.5" stroke-width="2.5"/>
      <polyline points="356,442 436,414 516,428 596,392 676,404 756,376 826,386" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- chrome accent beam along the bottom -->
    <rect x="330" y="500" width="520" height="3" rx="1.5" fill="url(#edge)" opacity="0.8"/>

    <!-- the dock folded into a puck on the mark -->
    <g>
      <circle cx="590" cy="540" r="26" fill="#08090d" stroke="url(#edge)" stroke-width="3"/>
      <circle cx="590" cy="540" r="9" fill="#fbbf24"/>
      <!-- ghost of the unfolded dock, fading -->
      <g opacity="0.28">
        <rect x="430" y="522" width="110" height="36" rx="18" fill="none" stroke="#8a7b57" stroke-width="2.5" stroke-dasharray="6 8"/>
        <rect x="650" y="522" width="110" height="36" rx="18" fill="none" stroke="#8a7b57" stroke-width="2.5" stroke-dasharray="6 8"/>
      </g>
    </g>

    <!-- tip toast, top right of canvas -->
    <g transform="translate(880 210)">
      <rect x="0" y="0" width="210" height="88" rx="16" fill="#08090d" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="2.5"/>
      <rect x="0" y="0" width="210" height="88" rx="16" fill="#f59e0b" fill-opacity="0.08"/>
      <rect x="18" y="16" width="46" height="24" rx="12" fill="#fbbf24"/>
      <text x="41" y="33" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700" fill="#08090d">TIP</text>
      <rect x="18" y="52" width="174" height="9" rx="4.5" fill="#fde68a" fill-opacity="0.6"/>
      <rect x="18" y="68" width="120" height="9" rx="4.5" fill="#fde68a" fill-opacity="0.4"/>
    </g>
  </g>
</svg>
