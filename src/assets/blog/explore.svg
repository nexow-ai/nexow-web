<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Explore tile mosaic with one tile opening into a sub-feed illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="140" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#explore</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="600" cy="330" rx="320" ry="220" fill="#f59e0b" fill-opacity="0.06" filter="url(#soft)"/>

    <!-- tile mosaic, varied sizes -->
    <g>
      <rect x="300" y="180" width="120" height="120" rx="16" fill="#f59e0b" fill-opacity="0.07" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="2.5"/>
      <rect x="300" y="320" width="120" height="180" rx="16" fill="#f59e0b" fill-opacity="0.05" stroke="#8a7b57" stroke-opacity="0.5" stroke-width="2.5"/>
      <rect x="440" y="180" width="180" height="140" rx="16" fill="#f59e0b" fill-opacity="0.07" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="2.5"/>
      <polyline points="464,292 506,252 548,272 596,222" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="440" y="340" width="180" height="160" rx="16" fill="#f59e0b" fill-opacity="0.05" stroke="#8a7b57" stroke-opacity="0.5" stroke-width="2.5"/>
      <!-- the opened tile: highlighted, expanding into sub-feed -->
      <rect x="640" y="180" width="240" height="180" rx="18" fill="#f59e0b" fill-opacity="0.14" stroke="url(#edge)" stroke-width="3"/>
      <polyline points="668,320 716,268 764,292 828,222" stroke="#fbbf24" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- connector stamp chips on the opened tile -->
      <rect x="664" y="200" width="60" height="26" rx="13" fill="#08090d" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2"/>
      <circle cx="680" cy="213" r="6" fill="#fbbf24"/>
      <rect x="692" y="209" width="22" height="8" rx="4" fill="#fde68a" fill-opacity="0.7"/>
    </g>

    <!-- sub-feed cascading from the opened tile -->
    <g>
      <line x1="760" y1="360" x2="760" y2="520" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
      <rect x="660" y="392" width="200" height="44" rx="12" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2"/>
      <rect x="680" y="409" width="120" height="10" rx="5" fill="#fde68a" fill-opacity="0.7"/>
      <rect x="676" y="452" width="200" height="44" rx="12" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>
      <rect x="696" y="469" width="140" height="10" rx="5" fill="#fde68a" fill-opacity="0.5"/>
      <rect x="692" y="512" width="200" height="44" rx="12" fill="#f59e0b" fill-opacity="0.05" stroke="#8a7b57" stroke-opacity="0.4" stroke-width="2"/>
      <rect x="712" y="529" width="100" height="10" rx="5" fill="#8a7b57" fill-opacity="0.8"/>
    </g>

    <!-- scope toggle: globe vs contacts -->
    <g transform="translate(330 528)">
      <rect x="0" y="0" width="170" height="52" rx="26" fill="#08090d" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2.5"/>
      <circle cx="44" cy="26" r="15" fill="none" stroke="#8a7b57" stroke-width="3"/>
      <path d="M29 26 h30 M44 11 a22 22 0 0 1 0 30 M44 11 a22 22 0 0 0 0 30" stroke="#8a7b57" stroke-width="2.5" fill="none"/>
      <circle cx="122" cy="26" r="17" fill="#fbbf24" fill-opacity="0.9"/>
      <circle cx="117" cy="21" r="5" fill="#08090d"/>
      <path d="M107 34 a10 8 0 0 1 20 0" fill="#08090d"/>
      <circle cx="130" cy="22" r="4" fill="#08090d"/>
    </g>
  </g>
</svg>
