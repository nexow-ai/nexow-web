<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cloud bot with alert and pulse illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="163" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#automation</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <path d="M110 315 H430 l40 -46 l46 92 l40 -66 l34 40 H1090" fill="none" stroke="url(#edge)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <ellipse cx="600" cy="315" rx="230" ry="200" fill="#f59e0b" fill-opacity="0.06" filter="url(#soft)"/>
    <line x1="600" y1="165" x2="600" y2="199" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="600" cy="155" r="9" fill="#fde68a"/>
    <rect x="480" y="199" width="240" height="176" rx="34" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
    <rect x="480" y="199" width="240" height="176" rx="34" fill="#d97706" fill-opacity="0.08"/>
    <circle cx="552" cy="297" r="20" fill="#fbbf24" fill-opacity="0.25" stroke="#fde68a" stroke-width="3"/>
    <circle cx="648" cy="297" r="20" fill="#fbbf24" fill-opacity="0.25" stroke="#fde68a" stroke-width="3"/>
    <circle cx="552" cy="297" r="6" fill="#fde68a"/>
    <circle cx="648" cy="297" r="6" fill="#fde68a"/>
    <rect x="560" y="341" width="80" height="8" rx="4" fill="#8a7b57"/>
    <!-- alert badge -->
    <circle cx="718" cy="205" r="30" fill="#d97706" stroke="#08090d" stroke-width="5"/>
    <path d="M718 189 v14 M718 215 v0.5" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
