<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crypto wallet card with coins and chain nodes illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="126" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#wallets</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="560" cy="320" rx="300" ry="220" fill="#f59e0b" fill-opacity="0.06" filter="url(#soft)"/>

    <!-- wallet card -->
    <g>
      <rect x="380" y="230" width="330" height="200" rx="24" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <rect x="380" y="230" width="330" height="200" rx="24" fill="#f59e0b" fill-opacity="0.12"/>
      <!-- clasp -->
      <rect x="646" y="304" width="92" height="52" rx="16" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <circle cx="692" cy="330" r="10" fill="#fbbf24"/>
      <!-- address line -->
      <rect x="410" y="266" width="160" height="10" rx="5" fill="#fde68a" fill-opacity="0.8"/>
      <rect x="410" y="292" width="110" height="10" rx="5" fill="#fde68a" fill-opacity="0.45"/>
      <!-- balance sparkline -->
      <polyline points="410,392 448,368 486,378 524,346 562,356 600,330" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- coins -->
    <circle cx="330" cy="200" r="30" fill="none" stroke="#fde68a" stroke-width="4"/>
    <text x="330" y="210" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="700" fill="#fde68a">&#946;</text>
    <circle cx="770" cy="200" r="26" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <text x="770" y="209" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="24" font-weight="700" fill="#f59e0b">&#926;</text>
    <circle cx="320" cy="470" r="22" fill="none" stroke="#d97706" stroke-width="4"/>
    <text x="320" y="478" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="20" font-weight="700" fill="#d97706">&#963;</text>

    <!-- multi-chain nodes fanning to the right -->
    <line x1="740" y1="430 " x2="900" y2="480" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <line x1="740" y1="380" x2="920" y2="380" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <line x1="740" y1="330" x2="900" y2="280" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <circle cx="920" cy="480" r="12" fill="#fbbf24"/>
    <circle cx="940" cy="380" r="12" fill="#d97706" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="920" cy="280" r="12" fill="none" stroke="#8a7b57" stroke-width="3"/>
  </g>
</svg>
