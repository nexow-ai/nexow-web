<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two widgets joined by a two-way wire, with connection, bot and agent sources feeding in and a test event travelling along it, illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="wire" x1="380" y1="300" x2="820" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="118" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#wires</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="600" cy="320" rx="360" ry="210" fill="#f59e0b" fill-opacity="0.06" filter="url(#soft)"/>

    <!-- widget A: a list you click a row in -->
    <g>
      <rect x="112" y="196" width="270" height="216" rx="22" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <rect x="140" y="224" width="112" height="11" rx="5.5" fill="#fde68a" fill-opacity="0.55"/>
      <rect x="140" y="262" width="214" height="30" rx="10" fill="#f59e0b" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="2"/>
      <rect x="158" y="273" width="86" height="9" rx="4.5" fill="#fde68a" fill-opacity="0.8"/>
      <rect x="140" y="304" width="214" height="30" rx="10" fill="#f59e0b" fill-opacity="0.05"/>
      <rect x="158" y="315" width="120" height="9" rx="4.5" fill="#8a7b57"/>
      <rect x="140" y="346" width="214" height="30" rx="10" fill="#f59e0b" fill-opacity="0.05"/>
      <rect x="158" y="357" width="98" height="9" rx="4.5" fill="#8a7b57"/>
      <!-- emit port -->
      <circle cx="382" cy="304" r="13" fill="#08090d" stroke="url(#edge)" stroke-width="4"/>
    </g>

    <!-- the wire itself: two-way, with the generated glue in the middle -->
    <g>
      <path d="M395 304 H 512" stroke="url(#wire)" stroke-width="5" stroke-linecap="round"/>
      <path d="M688 304 H 805" stroke="url(#wire)" stroke-width="5" stroke-linecap="round"/>
      <!-- glue node -->
      <rect x="512" y="266" width="176" height="76" rx="22" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <text x="536" y="313" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="26" fill="#fde68a">{ }</text>
      <rect x="586" y="290" width="76" height="9" rx="4.5" fill="#fde68a" fill-opacity="0.55"/>
      <rect x="586" y="308" width="52" height="9" rx="4.5" fill="#8a7b57"/>
      <!-- two-way arrowheads -->
      <path d="M462 292 l16 12 -16 12" fill="none" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M738 292 l16 12 -16 12" fill="none" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M738 232 l-16 12 16 12" fill="none" stroke="#f59e0b" stroke-opacity="0.75" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M462 232 l-16 12 16 12" fill="none" stroke="#f59e0b" stroke-opacity="0.75" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M395 244 H 462 M 478 244 H 722 M 738 244 H 805" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12"/>
      <!-- the test event in flight -->
      <g>
        <rect x="556" y="176" width="176" height="44" rx="22" fill="#f59e0b" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="2"/>
        <text x="578" y="205" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="21" fill="#fde68a">symbol ▸ ok</text>
      </g>
    </g>

    <!-- widget B: the chart that reacts -->
    <g>
      <rect x="818" y="196" width="270" height="216" rx="22" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <circle cx="818" cy="304" r="13" fill="#08090d" stroke="url(#edge)" stroke-width="4"/>
      <rect x="846" y="224" width="96" height="11" rx="5.5" fill="#fde68a" fill-opacity="0.55"/>
      <g>
        <line x1="866" y1="300" x2="866" y2="382" stroke="#fbbf24" stroke-width="2.5"/>
        <rect x="858" y="320" width="16" height="46" rx="3" fill="#fbbf24" fill-opacity="0.85"/>
        <line x1="906" y1="284" x2="906" y2="382" stroke="#f59e0b" stroke-width="2.5"/>
        <rect x="898" y="302" width="16" height="62" rx="3" fill="#f59e0b" fill-opacity="0.85"/>
        <line x1="946" y1="312" x2="946" y2="382" stroke="#fbbf24" stroke-width="2.5"/>
        <rect x="938" y="330" width="16" height="38" rx="3" fill="#fbbf24" fill-opacity="0.85"/>
        <line x1="986" y1="270" x2="986" y2="382" stroke="#fbbf24" stroke-width="2.5"/>
        <rect x="978" y="292" width="16" height="74" rx="3" fill="#fbbf24" fill-opacity="0.85"/>
        <line x1="1026" y1="296" x2="1026" y2="382" stroke="#f59e0b" stroke-width="2.5"/>
        <rect x="1018" y="314" width="16" height="52" rx="3" fill="#f59e0b" fill-opacity="0.85"/>
      </g>
    </g>

    <!-- the other half of the inventory: connections, bots, agents -->
    <g>
      <rect x="112" y="462" width="976" height="112" rx="24" fill="#f59e0b" fill-opacity="0.05" stroke="#8a7b57" stroke-opacity="0.45" stroke-width="2"/>
      <rect x="140" y="486" width="118" height="11" rx="5.5" fill="#fde68a" fill-opacity="0.4"/>
      <!-- connection card -->
      <g>
        <rect x="316" y="482" width="200" height="72" rx="18" fill="#08090d" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="2"/>
        <g fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="340" y="496" width="22" height="26" rx="7"/>
          <path d="M330 504 h10 M330 514 h10 M362 509 h10"/>
        </g>
        <rect x="378" y="504" width="104" height="10" rx="5" fill="#fde68a" fill-opacity="0.5"/>
        <rect x="378" y="524" width="62" height="8" rx="4" fill="#8a7b57"/>
      </g>
      <!-- bot card -->
      <g>
        <rect x="540" y="482" width="200" height="72" rx="18" fill="#08090d" stroke="#8a7b57" stroke-opacity="0.7" stroke-width="2"/>
        <rect x="558" y="500" width="34" height="26" rx="8" fill="none" stroke="#8a7b57" stroke-width="3"/>
        <circle cx="568" cy="513" r="3.2" fill="#8a7b57"/>
        <circle cx="582" cy="513" r="3.2" fill="#8a7b57"/>
        <path d="M575 500 v -8" stroke="#8a7b57" stroke-width="3" stroke-linecap="round"/>
        <rect x="606" y="504" width="104" height="10" rx="5" fill="#fde68a" fill-opacity="0.35"/>
        <rect x="606" y="524" width="52" height="8" rx="4" fill="#8a7b57"/>
      </g>
      <!-- agent card -->
      <g>
        <rect x="764" y="482" width="200" height="72" rx="18" fill="#08090d" stroke="#8a7b57" stroke-opacity="0.7" stroke-width="2"/>
        <circle cx="798" cy="513" r="17" fill="none" stroke="#8a7b57" stroke-width="3"/>
        <path d="M798 496 v 34 M781 513 h 34 M787 501 l 22 24 M809 501 l -22 24" stroke="#8a7b57" stroke-width="2" stroke-opacity="0.75"/>
        <rect x="830" y="504" width="104" height="10" rx="5" fill="#fde68a" fill-opacity="0.35"/>
        <rect x="830" y="524" width="70" height="8" rx="4" fill="#8a7b57"/>
      </g>
      <!-- already-wired mark on the connection card -->
      <g>
        <circle cx="516" cy="482" r="15" fill="#08090d" stroke="url(#edge)" stroke-width="3"/>
        <path d="M509 482 l5 6 10 -12" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
