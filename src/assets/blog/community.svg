<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Community profile with reputation medals and feed cards illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="154" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#community</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="600" cy="320" rx="320" ry="220" fill="#f59e0b" fill-opacity="0.06" filter="url(#soft)"/>

    <!-- profile hero card -->
    <g>
      <rect x="330" y="180" width="540" height="150" rx="24" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <rect x="330" y="180" width="540" height="150" rx="24" fill="#f59e0b" fill-opacity="0.10"/>
      <!-- avatar -->
      <circle cx="410" cy="255" r="42" fill="none" stroke="#fde68a" stroke-width="4"/>
      <circle cx="410" cy="242" r="14" fill="#fde68a"/>
      <path d="M382 288 a30 30 0 0 1 56 0" fill="#fde68a"/>
      <!-- name and bio lines -->
      <rect x="480" y="222" width="180" height="12" rx="6" fill="#fde68a" fill-opacity="0.85"/>
      <rect x="480" y="252" width="280" height="10" rx="5" fill="#fde68a" fill-opacity="0.45"/>
      <rect x="480" y="278" width="220" height="10" rx="5" fill="#fde68a" fill-opacity="0.3"/>
    </g>

    <!-- reputation medals: tiered + rare + legendary -->
    <g>
      <circle cx="420" cy="420" r="34" fill="none" stroke="#8a7b57" stroke-width="4"/>
      <path d="M406 432 l10 -24 h8 l10 24" stroke="#8a7b57" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="520" cy="420" r="38" fill="none" stroke="#d97706" stroke-width="4"/>
      <path d="M504 434 l12 -28 h8 l12 28" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="630" cy="420" r="44" fill="none" stroke="url(#edge)" stroke-width="4"/>
      <path d="M610 408 l8 22 12 -30 12 30 8 -22" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="740" cy="420" r="38" fill="#f59e0b" fill-opacity="0.12" stroke="#fde68a" stroke-width="4"/>
      <path d="M740 400 l6 14 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2 z" fill="#fde68a"/>
    </g>

    <!-- feed reactions floating right -->
    <g>
      <rect x="900" y="240" width="150 " height="44" rx="14" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2"/>
      <path d="M922 268 a8 8 0 0 1 0 -12 a8 8 0 0 1 12 0 a8 8 0 0 1 12 0 a8 8 0 0 1 0 12 l-12 12 z" fill="#fbbf24"/>
      <rect x="954" y="256" width="70" height="10" rx="5" fill="#fde68a" fill-opacity="0.6"/>
      <rect x="920" y="310" width="150" height="44" rx="14" fill="#f59e0b" fill-opacity="0.08" stroke="#8a7b57" stroke-opacity="0.45" stroke-width="2"/>
      <path d="M942 322 h26 a8 8 0 0 1 8 8 v10 a8 8 0 0 1 -8 8 h-16 l-10 9 z" fill="none" stroke="#fde68a" stroke-width="3" stroke-linejoin="round"/>
      <rect x="986" y="330" width="60" height="10" rx="5" fill="#fde68a" fill-opacity="0.6"/>
    </g>
  </g>
</svg>
