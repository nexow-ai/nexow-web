<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bot node fanning signals out to inbox, widgets, webhook and database illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="98" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#bots</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="440" cy="330" rx="260" ry="210" fill="#f59e0b" fill-opacity="0.06" filter="url(#soft)"/>

    <!-- RSI curve feeding the bot -->
    <polyline points="180,300 220,260 260,340 300,290 340,330" stroke="#8a7b57" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- bot node -->
    <circle cx="440" cy="330" r="72" fill="#08090d" stroke="url(#edge)" stroke-width="3"/>
    <circle cx="440" cy="330" r="72" fill="#f59e0b" fill-opacity="0.12"/>
    <circle cx="440" cy="330" r="26" fill="none" stroke="#fde68a" stroke-width="4"/>
    <circle cx="440" cy="330" r="8" fill="#fde68a"/>
    <line x1="440" y1="238" x2="440" y2="218" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <circle cx="440" cy="210" r="7" fill="#fbbf24"/>

    <!-- fan-out to four sinks -->
    <line x1="512" y1="290" x2="810" y2="180" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <line x1="518" y1="318" x2="810" y2="290" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <line x1="518" y1="348" x2="810" y2="400" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <line x1="512" y1="376" x2="810" y2="505" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>

    <!-- sink: notify bell -->
    <g transform="translate(830 150)">
      <rect x="0" y="0" width="66" height="66" rx="18" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2.5"/>
      <path d="M23 40 a10 12 0 0 1 20 0 z M33 20 v4" stroke="#fde68a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="33" cy="46" r="3" fill="#fde68a"/>
    </g>
    <!-- sink: widgets bus -->
    <g transform="translate(830 260)">
      <rect x="0" y="0" width="66" height="66" rx="18" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2.5"/>
      <rect x="14" y="14" width="16" height="16" rx="4" fill="none" stroke="#fde68a" stroke-width="3"/>
      <rect x="36" y="14" width="16" height="16" rx="4" fill="none" stroke="#fde68a" stroke-width="3"/>
      <rect x="14" y="36" width="16" height="16" rx="4" fill="none" stroke="#fde68a" stroke-width="3"/>
      <rect x="36" y="36" width="16" height="16" rx="4" fill="#fbbf24"/>
    </g>
    <!-- sink: webhook -->
    <g transform="translate(830 370)">
      <rect x="0" y="0" width="66" height="66" rx="18" fill="#f59e0b" fill-opacity="0.10" stroke="url(#edge)" stroke-width="2.5"/>
      <path d="M20 44 a13 13 0 1 1 26 0" stroke="#fbbf24" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="44" r="5" fill="#fde68a"/>
      <circle cx="46" cy="44" r="5" fill="#fde68a"/>
      <circle cx="33" cy="22" r="5" fill="#fbbf24"/>
    </g>
    <!-- sink: database -->
    <g transform="translate(830 480)">
      <rect x="0" y="0" width="66" height="66" rx="18" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2.5"/>
      <ellipse cx="33" cy="20" rx="16" ry="7" fill="none" stroke="#fde68a" stroke-width="3"/>
      <path d="M17 20 v26 a16 7 0 0 0 32 0 v-26" stroke="#fde68a" stroke-width="3" fill="none"/>
      <path d="M17 33 a16 7 0 0 0 32 0" stroke="#fde68a" stroke-width="3" fill="none"/>
    </g>
  </g>
</svg>
