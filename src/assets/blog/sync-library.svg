<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two devices syncing a workspace with library shelves illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="98" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#sync</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="600" cy="330" rx="320" ry="220" fill="#f59e0b" fill-opacity="0.06" filter="url(#soft)"/>

    <!-- desktop device -->
    <g>
      <rect x="270" y="200" width="300" height="200" rx="20" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <rect x="270" y="200" width="300" height="200" rx="20" fill="#f59e0b" fill-opacity="0.10"/>
      <rect x="296" y="228" width="110" height="66" rx="10" fill="none" stroke="#fde68a" stroke-width="3"/>
      <rect x="420" y="228" width="124" height="30" rx="8" fill="none" stroke="#fde68a" stroke-width="3" opacity="0.7"/>
      <rect x="420" y="270" width="124" height="24" rx="8" fill="#fbbf24" fill-opacity="0.5"/>
      <rect x="296" y="308" width="248" height="64" rx="10" fill="none" stroke="#8a7b57" stroke-width="3" opacity="0.8"/>
      <rect x="380" y="400" width="80" height="12" rx="6" fill="#8a7b57"/>
    </g>

    <!-- phone device, same layout -->
    <g>
      <rect x="760" y="210" width="150" height="250" rx="24" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
      <rect x="760" y="210" width="150" height="250" rx="24" fill="#f59e0b" fill-opacity="0.10"/>
      <rect x="782" y="240" width="106" height="52" rx="9" fill="none" stroke="#fde68a" stroke-width="3"/>
      <rect x="782" y="304" width="106" height="24" rx="8" fill="#fbbf24" fill-opacity="0.5"/>
      <rect x="782" y="340" width="106" height="52" rx="9" fill="none" stroke="#8a7b57" stroke-width="3" opacity="0.8"/>
      <rect x="812" y="424" width="46" height="8" rx="4" fill="#8a7b57"/>
    </g>

    <!-- sync arrows between them -->
    <g>
      <path d="M600 280 h120" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
      <path d="M706 268 L726 280 L706 292" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M720 360 h-120" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
      <path d="M614 348 L594 360 L614 372" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- library shelf: widgets, screens, workspaces -->
    <g>
      <line x1="330" y1="510" x2="870" y2="510" stroke="#8a7b57" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
      <rect x="370" y="462" width="70" height="44" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="2.5"/>
      <rect x="466" y="452" width="70" height="54" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#fde68a" stroke-opacity="0.6" stroke-width="2.5"/>
      <rect x="562" y="468" width="70" height="38" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="2.5"/>
      <rect x="658" y="446" width="70" height="60" rx="10" fill="#fbbf24" fill-opacity="0.18" stroke="url(#edge)" stroke-width="2.5"/>
      <rect x="754" y="462" width="70" height="44" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="2.5"/>
    </g>
  </g>
</svg>
