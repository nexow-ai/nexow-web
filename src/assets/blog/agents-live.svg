<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deployed AI agent chip with a live run timeline illustration">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 150) rotate(40) scale(620 560)">
      <stop stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 600) rotate(-140) scale(640 560)">
      <stop stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="140" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#08090d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g opacity="0.85">
    <circle cx="1058" cy="59" r="6" fill="#fbbf24"/>
    <text x="1078" y="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="23" font-weight="700" letter-spacing="7" fill="#fdf3d8">NEXOW</text>
  </g>

  <!-- tag chip -->
  <g transform="translate(64 588)">
    <rect x="0" y="0" width="112" height="44" rx="22" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="22" y="29" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#fde68a">#agents</text>
  </g>

  <!-- top hairline accent -->
  <rect x="64" y="106" width="150" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <ellipse cx="470" cy="320" rx="240" ry="210" fill="#f59e0b" fill-opacity="0.06" filter="url(#soft)"/>
    <ellipse cx="470" cy="320" rx="168" ry="151" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 9"/>
    <!-- chip pins -->
    <line x1="419" y1="245" x2="419" y2="223" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="419" y1="395" x2="419" y2="417" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="395" y1="269" x2="373" y2="269" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="545" y1="269" x2="567" y2="269" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="444.5" y1="245" x2="444.5" y2="223" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="444.5" y1="395" x2="444.5" y2="417" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="395" y1="294.5" x2="373" y2="294.5" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="545" y1="294.5" x2="567" y2="294.5" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="470" y1="245" x2="470" y2="223" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="470" y1="395" x2="470" y2="417" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="395" y1="320" x2="373" y2="320" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="545" y1="320" x2="567" y2="320" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="495.5" y1="245" x2="495.5" y2="223" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="495.5" y1="395" x2="495.5" y2="417" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="395" y1="345.5" x2="373" y2="345.5" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="545" y1="345.5" x2="567" y2="345.5" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="521" y1="245" x2="521" y2="223" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="521" y1="395" x2="521" y2="417" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="395" y1="371" x2="373" y2="371" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <line x1="545" y1="371" x2="567" y2="371" stroke="#8a7b57" stroke-width="5" stroke-linecap="round"/>
    <!-- chip body with a play glyph: deployed, running -->
    <rect x="395" y="245" width="150" height="150" rx="26" fill="#08090d" stroke="url(#edge)" stroke-width="2.5"/>
    <rect x="395" y="245" width="150" height="150" rx="26" fill="#f59e0b" fill-opacity="0.12"/>
    <path d="M455 292 L505 320 L455 348 Z" fill="#fde68a"/>

    <!-- runs timeline: stacked run cards with status dots -->
    <line x1="700" y1="200" x2="700" y2="470" stroke="#8a7b57" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <g>
      <circle cx="700" cy="225" r="11" fill="#fbbf24"/>
      <rect x="736" y="200" width="330" height="50" rx="14" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>
      <rect x="756" y="220" width="150" height="10" rx="5" fill="#fde68a" fill-opacity="0.8"/>
      <path d="M1030 219 l7 9 l14 -16" stroke="#fbbf24" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <circle cx="700" cy="325" r="11" fill="#d97706" stroke="#f59e0b" stroke-width="3"/>
      <rect x="736" y="300" width="330" height="50" rx="14" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>
      <rect x="756" y="320" width="190" height="10" rx="5" fill="#fde68a" fill-opacity="0.6"/>
      <path d="M1030 319 l7 9 l14 -16" stroke="#fbbf24" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <circle cx="700" cy="425" r="11" fill="none" stroke="#8a7b57" stroke-width="3"/>
      <rect x="736" y="400" width="330" height="50" rx="14" fill="#f59e0b" fill-opacity="0.05" stroke="#8a7b57" stroke-opacity="0.4" stroke-width="2"/>
      <rect x="756" y="420" width="120" height="10" rx="5" fill="#8a7b57" fill-opacity="0.8"/>
    </g>
  </g>
</svg>
