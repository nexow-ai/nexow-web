      <rect x="240" y="158" width="440" height="56" rx="28" fill="#f59e0b" fill-opacity="0.08"/>
      <circle cx="286" cy="186" r="13" fill="none" stroke="#fde68a" stroke-width="3.5"/>
      <path d="M296 196 l12 12" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="324" y="180" width="188" height="12" rx="6" fill="#fde68a" fill-opacity="0.45"/>
    </g>

