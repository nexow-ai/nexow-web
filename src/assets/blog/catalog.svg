      <rect x="700" y="166" width="96" height="40" rx="20" fill="#f59e0b" fill-opacity="0.22" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="722" y="181" width="52" height="10" rx="5" fill="#fde68a" fill-opacity="0.75"/>
