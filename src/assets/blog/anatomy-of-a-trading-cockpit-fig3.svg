<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A graph of the same eight numbered widgets: a two-way wire arcs between the watchlist and the chart, one-way wires run to the order book and funding tiles, and a connection, a bot and an agent attach from the left, diagram">
  <defs>
    <radialGradient id="f3glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(660 20) rotate(105) scale(620 760)">
      <stop stop-color="#10c5a3" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#10c5a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f3edge" x1="380" y1="80" x2="1120" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5cf0d0"/>
      <stop offset="1" stop-color="#10c5a3"/>
    </linearGradient>
    <linearGradient id="f3wire" x1="540" y1="120" x2="840" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10c5a3"/>
      <stop offset="0.5" stop-color="#9dfae2"/>
      <stop offset="1" stop-color="#10c5a3"/>
    </linearGradient>
    <pattern id="f3grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="#08090d"/>
  <rect width="1200" height="520" fill="url(#f3grid)"/>
  <rect width="1200" height="520" fill="url(#f3glow)"/>

  <!-- attachments from the rest of the inventory -->
  <g>
