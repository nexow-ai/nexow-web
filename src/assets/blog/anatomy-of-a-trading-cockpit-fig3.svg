    <path d="M254 295 Q 700 470 948 350" fill="none" stroke="#558b81" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9"/>
    <path d="M254 435 Q 700 480 948 366" fill="none" stroke="#558b81" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9"/>
  </g>

  <!-- one-way wires -->
