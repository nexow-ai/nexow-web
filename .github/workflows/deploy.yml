name: Deploy

# Ship Cloudflare Pages for whichever promote branch just moved.
#   push to dev  → Pages branch `dev`
#   push to stg  → Pages branch `stg`
#   push to main → Pages branch `main` (production, nexow.ai)
on:
  push:
    branches: [main, stg, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Pages branch to deploy
        type: choice
        options: [main, stg, dev]
        default: main

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Cloudflare Pages
    if: >
      github.event_name == 'workflow_dispatch'
      || !contains(github.event.head_commit.message, '[skip actions]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync content collections
        run: bun run content:sync

      - name: Build
        run: bun run build

      - name: Reject files Pages will not upload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          limit = 25 * 1024 * 1024
          bad = []
          for root, _, files in os.walk("dist"):
              for name in files:
                  path = os.path.join(root, name)
                  size = os.path.getsize(path)
                  if size > limit:
                      bad.append((size, path))
          if bad:
              print("Cloudflare Pages rejects files over 25 MiB:", file=sys.stderr)
              for size, path in sorted(bad, reverse=True):
                  print(f"  {size / 1024 / 1024:.1f} MiB  {path}", file=sys.stderr)
              raise SystemExit(1)
          print("All dist files are within the 25 MiB Pages limit.")
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=nexow-web --branch=${{ env.PAGES_BRANCH }} --commit-dirty=true
