name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Node satisfies the `engines` field and runs scripts/*.mjs; Bun is the
      # package manager the lockfile belongs to.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The content layer's data store is generated, not committed; every later
      # step needs it to resolve `astro:content` and the blog hero images.
      - name: Sync content collections
        run: bun run content:sync

      - name: Type-check
        run: bun run check

      - name: Test with coverage
        run: bunx vitest run --coverage

      - name: Build
        run: bun run build

      # Link integrity, sitemap coverage and asset presence over the real
      # output — these skip themselves when dist/ is absent, so they only
      # mean anything here, after the build.
      - name: Test built output
        run: bun run test:build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn
