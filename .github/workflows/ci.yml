name: CI

# Test depth follows the promote path:
#   PR → dev   typecheck only (fast feedback)
#   PR → stg   typecheck + coverage + build + e2e (the production gate)
#   push       no suite — stg already ran it, main just clones stg
on:
  push:
    branches: [main, stg, dev]
  pull_request:
    branches: [main, stg, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    name: Reject direct pushes
    if: >
      github.event_name == 'push'
      && contains(fromJSON('["main","stg"]'), github.ref_name)
    runs-on: ubuntu-latest
    steps:
      - name: Require a promote PR or the stg → main clone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          login="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.author.login // empty')"
          message="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.commit.message')"

          if [ "$BRANCH" = "main" ] && [ "$login" = "github-actions[bot]" ]; then
            if printf '%s\n' "$message" | grep -q '^chore(release):' \
              && printf '%s\n' "$message" | grep -q '\[skip actions\]'; then
              echo "OK: release commit on main"
              exit 0
            fi
            if printf '%s\n' "$message" | grep -q '^chore: promote stg to main'; then
              echo "OK: stg → main clone"
              exit 0
            fi
          fi

          expected_head="stg"
          if [ "$BRANCH" = "stg" ]; then
            expected_head="dev"
          fi

          matched="0"
          for _ in 1 2 3 4 5; do
            matched="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
                --jq "[.[] | select(.merged_at != null) | select(.base.ref == \"${BRANCH}\") | select(.head.ref == \"${expected_head}\")] | length"
            )"
            if [ "$matched" != "0" ]; then
              echo "OK: ${expected_head} → ${BRANCH} via promote PR"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Direct pushes to ${BRANCH} are not allowed. Promote via ${expected_head} → ${BRANCH}."
          exit 1

  checks:
    name: Checks
    needs: [promotion]
    if: >
      always()
      && (needs.promotion.result == 'success' || needs.promotion.result == 'skipped')
      && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch' || github.base_ref == 'dev' || github.base_ref == 'stg')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync content collections
        run: bun run content:sync

      - name: Type-check
        run: bun run check

      # Full suite only on the stg gate (or a manual dispatch). PRs into `dev`
      # stop after typecheck so review is not blocked for the browser run.
      - name: Test with coverage
        if: github.event_name == 'workflow_dispatch' || github.base_ref == 'stg'
        run: bunx vitest run --coverage

      - name: Build
        if: github.event_name == 'workflow_dispatch' || github.base_ref == 'stg'
        run: bun run build

      - name: Test built output
        if: github.event_name == 'workflow_dispatch' || github.base_ref == 'stg'
        run: bun run test:build

      - name: Upload coverage report
        if: always() && (github.event_name == 'workflow_dispatch' || github.base_ref == 'stg')
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: browser
    needs: [promotion]
    if: >
      always()
      && (needs.promotion.result == 'success' || needs.promotion.result == 'skipped')
      && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'stg'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Sync content collections
        run: bun run content:sync

      - name: Build
        run: bun run build

      - name: Run browser tests
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  gate:
    name: CI gate
    needs: [promotion, checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require no failures
        run: |
          set -euo pipefail
          promo='${{ needs.promotion.result }}'
          checks='${{ needs.checks.result }}'
          e2e='${{ needs.e2e.result }}'
          echo "promotion=${promo} checks=${checks} e2e=${e2e}"
          if [ "$promo" = failure ] || [ "$checks" = failure ] || [ "$e2e" = failure ]; then
            echo "::error::CI failed (promotion=${promo} checks=${checks} e2e=${e2e})"
            exit 1
          fi
