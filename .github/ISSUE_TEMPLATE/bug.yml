name: Bug report
description: Something on nexow.ai is broken or incorrect.
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the **marketing site** (`nexow-web`).
        Product / account issues go to [nexow.ai/contact](https://nexow.ai/contact).
        Security issues: read [SECURITY.md](https://github.com/nexow-ai/nexow-web/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://nexow.ai/…
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      options:
        - en
        - es
        - fr
        - it
        - de
        - pt
        - nl
        - zh
        - ja
        - ar
        - he
        - ko
        - ru
        - uk
        - ms
        - el
        - tr
        - not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open … 2. Click … 3. See …
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: Browser, OS, viewport (desktop / mobile)
  - type: checkboxes
    id: terms
    attributes:
      label: Notices
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I understand this repository is © Nexow, Inc. and licensed under Apache-2.0.
          required: true
